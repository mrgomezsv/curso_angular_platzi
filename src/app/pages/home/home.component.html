<section class="todoapp">
    <header class="header">
      <div class="container">
        <h1>My Day</h1>
        <p>All my tasks in one place</p>
        <input
          class="new-todo"
          placeholder="Type new todo"
          autofocus
          type="text"
          (change)="handleNewTask($event)"
        />
      </div>
    </header>
    <div class="container todoapp-wrapper">
      <!-- This section should be hidden by default and shown when there are todos -->
      <pre>
        <code>
          {{ getTasks() | json }}
        </code>
      </pre>
      <section class="main" *ngIf="getTasks().length > 0">
        <ul class="todo-list">
          <li *ngFor="let task of getFilteredTasks()" 
              [class.completed]="task.completed"
              [class.editing]="isEditing(task.id)">
            <div class="view">
              <input 
                class="toggle" 
                type="checkbox" 
                [checked]="task.completed" 
                (change)="toggleTaskCompletion(task.id)" 
              />
              <label (dblclick)="startEditing(task.id)">{{ task.title }}</label>
              <button class="destroy" (click)="deleteTask(task.id)"></button>
            </div>
            <input 
              class="edit" 
              [value]="isEditing(task.id) ? getEditingTitle() : task.title"
              (input)="handleEditEvent($event, task.id)"
              (blur)="handleSaveEvent($event, task.id)"
              (keyup.enter)="handleSaveEvent($event, task.id)"
            />
          </li>
        </ul>
      </section>
      <!-- This footer should be hidden by default and shown when there are todos -->
      <footer class="footer" *ngIf="getTasks().length > 0">
        <!-- This should be `0 items left` by default -->
        <span class="todo-count">
          <strong>{{ pendingTasks() }}</strong>
          <span *ngIf="pendingTasks() === 1; else elseBlock"> item left</span>
          <ng-template #elseBlock> items left</ng-template>
        </span>
        <!-- Remove this if you don't implement routing -->
        <ul class="filters">
          <li>
            <a routerLink="/" class="selected">All</a>
          </li>
          <li>
            <a routerLink="/pending">Pending</a>
          </li>
          <li>
            <a routerLink="/completed">Completed</a>
          </li>
        </ul>
        <!-- Hidden if no completed items are left ↓ -->
        <button *ngIf="hasCompletedTasks()" 
                class="clear-completed"
                (click)="clearCompleted()">
          Clear completed
        </button>
      </footer>
    </div>
  </section>
